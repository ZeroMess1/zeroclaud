name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-levels: '31'
        build-tools-version: '31.0.0'

    - name: Create Cordova Project
      run: |
        npm install -g cordova
        cordova create ZeroMessenger com.zeromessenger.app "Zero Messenger"
        cd ZeroMessenger
        
    - name: Add Android Platform
      run: |
        cd ZeroMessenger
        cordova platform add android
        
    - name: Copy Web Files
      run: |
        cd ZeroMessenger
        cp ../index.html www/
        cp ../styles.css www/
        cp ../config.js www/
        cp ../utils.js www/
        cp ../auth.js www/
        cp ../firestore.js www/
        cp ../chat.js www/
        cp ../ui.js www/
        cp ../app.js www/
        
    - name: Update config.xml
      run: |
        cd ZeroMessenger
        cat > config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.zeromessenger.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
            <name>Zero Messenger</name>
            <description>Encrypted messenger app</description>
            <author email="support@zeromessenger.com" href="https://zeromessenger.com">Zero Messenger Team</author>
            <content src="index.html" />
            <plugin name="cordova-plugin-whitelist" spec="^1.3.3" />
            <plugin name="cordova-plugin-firebase" spec="^5.4.0" />
            <plugin name="cordova-plugin-camera" spec="^4.1.0" />
            <plugin name="cordova-plugin-file" spec="^6.0.1" />
            <plugin name="cordova-plugin-network-information" spec="^2.0.1" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <allow-intent href="tel:*" />
            <allow-intent href="sms:*" />
            <allow-intent href="mailto:*" />
            <allow-intent href="geo:*" />
            <access origin="*" />
            <preference name="android-minSdkVersion" value="21" />
            <preference name="android-targetSdkVersion" value="31" />
        </widget>
        EOF
        
    - name: Build APK
      run: |
        cd ZeroMessenger
        cordova build android --release
        
    - name: Sign APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd ZeroMessenger
        # Декодируем keystore
        echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.keystore
        
        # Подписываем APK
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore my-release-key.keystore \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          "$KEY_ALIAS"
        
        # Оптимизируем APK
        zipalign -v 4 platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
          platforms/android/app/build/outputs/apk/release/ZeroMessenger-release.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: ZeroMessenger-APK
        path: ZeroMessenger/platforms/android/app/build/outputs/apk/release/ZeroMessenger-release.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ZeroMessenger/platforms/android/app/build/outputs/apk/release/ZeroMessenger-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
