name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install npm dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install Cordova
      run: npm install -g cordova@latest

    - name: Create Cordova Project
      run: |
        cordova create ZeroMessenger com.zeromessenger.app "Zero Messenger"
        cd ZeroMessenger
        cordova platform add android

    - name: Copy Web Files to Cordova
      run: |
        cd ZeroMessenger/www
        rm -f index.html
        cd ../../
        cp index.html ZeroMessenger/www/
        cp styles.css ZeroMessenger/www/
        cp config.js ZeroMessenger/www/
        cp utils.js ZeroMessenger/www/
        cp auth.js ZeroMessenger/www/
        cp firestore.js ZeroMessenger/www/
        cp chat.js ZeroMessenger/www/
        cp ui.js ZeroMessenger/www/
        cp app.js ZeroMessenger/www/

    - name: Update Cordova config.xml
      run: |
        cd ZeroMessenger
        cat > config.xml << 'XML_EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.zeromessenger.app" version="1.0.0" 
                xmlns="http://www.w3.org/ns/widgets" 
                xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Zero Messenger</name>
            <description>Modern Messenger App</description>
            <author email="support@zeromessenger.com" href="https://zeromessenger.com">Zero Messenger Team</author>
            <content src="index.html" />
            
            <allow-navigation href="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <allow-intent href="tel:*" />
            <allow-intent href="sms:*" />
            <allow-intent href="mailto:*" />
            <allow-intent href="geo:*" />
            
            <access origin="*" />
            
            <preference name="loglevel" value="verbose" />
            <preference name="android-minSdkVersion" value="21" />
            <preference name="android-targetSdkVersion" value="33" />
            <preference name="android-build-tool-version" value="33.0.0" />
            <preference name="orientation" value="portrait" />
            <preference name="fullscreen" value="false" />
            <preference name="DisallowOverscroll" value="true" />
        </widget>
        XML_EOF

    - name: Build APK (Release)
      run: |
        cd ZeroMessenger
        cordova build android --release
      env:
        GRADLE_OPTS: -Xmx2048m

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore
        ls -lh my-release-key.keystore

    - name: Find APK and Sign
      run: |
        find ZeroMessenger -name "*release*apk" -type f
        APK_FILE=$(find ZeroMessenger/platforms/android -name "app-release*apk" | head -1)
        echo "Found APK: $APK_FILE"
        APK_DIR=$(dirname "$APK_FILE")
        cd "$APK_DIR"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore ../../../../../../../my-release-key.keystore \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          "$(basename $APK_FILE)" \
          "${{ secrets.KEY_ALIAS }}"

    - name: Align APK
      run: |
        APK_FILE=$(find ZeroMessenger/platforms/android -name "app-release*apk" | head -1)
        APK_DIR=$(dirname "$APK_FILE")
        cd "$APK_DIR"
        zipalign -v 4 "$(basename $APK_FILE)" ZeroMessenger-v1.0.0.apk
        ls -lh ZeroMessenger-v1.0.0.apk
        cp ZeroMessenger-v1.0.0.apk ../../../../../ZeroMessenger-v1.0.0.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZeroMessenger-APK
        path: ZeroMessenger-v1.0.0.apk
        retention-days: 30

    - name: Create Release (on Tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ZeroMessenger-v1.0.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
