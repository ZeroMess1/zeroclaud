name: Build APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'

    - run: npm install

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-build-tools android-sdk-platform-tools

    - name: Create APK Project Structure
      run: |
        mkdir -p zero-app/src/main/assets/www
        mkdir -p zero-app/src/main/java/com/zeromessenger/app
        mkdir -p zero-app/src/main/res/values
        mkdir -p zero-app/src/main/res/drawable
        mkdir -p zero-app/build

    - name: Copy Web Files
      run: |
        cp index.html zero-app/src/main/assets/www/
        cp styles.css zero-app/src/main/assets/www/
        cp config.js zero-app/src/main/assets/www/
        cp utils.js zero-app/src/main/assets/www/
        cp auth.js zero-app/src/main/assets/www/
        cp firestore.js zero-app/src/main/assets/www/
        cp chat.js zero-app/src/main/assets/www/
        cp ui.js zero-app/src/main/assets/www/
        cp app.js zero-app/src/main/assets/www/

    - name: Create AndroidManifest.xml
      run: |
        cat > zero-app/src/main/AndroidManifest.xml << 'MANIFEST'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.zeromessenger.app">

            <uses-sdk
                android:minSdkVersion="21"
                android:targetSdkVersion="33" />

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:label="Zero Messenger"
                android:icon="@mipmap/ic_launcher"
                android:debuggable="false"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".MainActivity"
                    android:label="Zero Messenger"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        MANIFEST

    - name: Create strings.xml
      run: |
        cat > zero-app/src/main/res/values/strings.xml << 'STRINGS'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">Zero Messenger</string>
        </resources>
        STRINGS

    - name: Create MainActivity.java
      run: |
        cat > zero-app/src/main/java/com/zeromessenger/app/MainActivity.java << 'JAVA'
        package com.zeromessenger.app;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebSettings;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                webView = (WebView) findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/www/index.html");
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        JAVA

    - name: Create layout XML
      run: |
        mkdir -p zero-app/src/main/res/layout
        cat > zero-app/src/main/res/layout/activity_main.xml << 'LAYOUT'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical">

            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </LinearLayout>
        LAYOUT

    - name: Create R.java (resources)
      run: |
        cat > zero-app/src/main/java/com/zeromessenger/app/R.java << 'RFILE'
        package com.zeromessenger.app;

        public final class R {
            public static final class layout {
                public static final int activity_main = 0x7f020000;
            }
            public static final class id {
                public static final int webview = 0x7f050000;
            }
            public static final class string {
                public static final int app_name = 0x7f060000;
            }
            public static final class mipmap {
                public static final int ic_launcher = 0x7f070000;
            }
        }
        RFILE

    - name: Compile Java
      run: |
        mkdir -p zero-app/build/classes
        javac -d zero-app/build/classes \
          -cp /usr/lib/android-sdk/platforms/android-33/android.jar \
          zero-app/src/main/java/com/zeromessenger/app/*.java 2>&1 | head -20 || true

    - name: Create DEX
      run: |
        mkdir -p zero-app/build/dex
        # Try with d8 (modern)
        d8 zero-app/build/classes/com/zeromessenger/app/*.class \
          --lib /usr/lib/android-sdk/platforms/android-33/android.jar \
          --output zero-app/build/dex 2>/dev/null || \
        # Fallback to dx (legacy)
        dx --dex --output=zero-app/build/dex/classes.dex zero-app/build/classes 2>/dev/null || \
        echo "DEX creation skipped"

    - name: Package APK
      run: |
        cd zero-app/src/main
        aapt package -f \
          -M AndroidManifest.xml \
          -S res \
          -A assets \
          -I /usr/lib/android-sdk/platforms/android-33/android.jar \
          -F app-unsigned.apk 2>&1 | head -20 || true
        
        if [ -f app-unsigned.apk ]; then
          echo "APK created with aapt"
          cp app-unsigned.apk ../../../app-unsigned.apk
        else
          echo "Creating APK with zip..."
          cd ../..
          zip -r app-unsigned.apk . -x "*.git*" "*.class" "*.dex" "build/*" 2>/dev/null || true
        fi

    - name: Check APK
      run: |
        ls -lh zero-app/app-unsigned.apk || ls -lh app-unsigned.apk || echo "APK not found"
        file zero-app/app-unsigned.apk || file app-unsigned.apk || true

    - name: Align APK
      run: |
        APK_UNSIGNED=$(find . -name "app-unsigned.apk" | head -1)
        if [ -z "$APK_UNSIGNED" ]; then
          echo "APK file not found!"
          exit 1
        fi
        echo "Found: $APK_UNSIGNED"
        
        zipalign -v 4 "$APK_UNSIGNED" ZeroMessenger.apk
        ls -lh ZeroMessenger.apk

    - uses: actions/upload-artifact@v4
      with:
        name: ZeroMessenger-APK
        path: ZeroMessenger.apk
        retention-days: 30
