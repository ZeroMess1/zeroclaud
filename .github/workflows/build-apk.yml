name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'

    - run: npm install

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk
        export ANDROID_SDK_ROOT=/usr/lib/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create ZeroMessenger com.zeromessenger.app "Zero Messenger"
        cd ZeroMessenger
        cordova platform add android

    - name: Copy Web Files
      run: |
        cp index.html ZeroMessenger/www/
        cp styles.css ZeroMessenger/www/
        cp config.js ZeroMessenger/www/
        cp utils.js ZeroMessenger/www/
        cp auth.js ZeroMessenger/www/
        cp firestore.js ZeroMessenger/www/
        cp chat.js ZeroMessenger/www/
        cp ui.js ZeroMessenger/www/
        cp app.js ZeroMessenger/www/

    - name: Build APK
      run: |
        cd ZeroMessenger
        cordova build android --release
      env:
        GRADLE_OPTS: -Xmx2048m

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore

    - name: Sign APK
      run: |
        cd ZeroMessenger/platforms/android/app/build/outputs/apk/release
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore ../../../../../my-release-key.keystore \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          app-release-unsigned.apk "${{ secrets.KEY_ALIAS }}"

    - name: Align APK
      run: |
        cd ZeroMessenger/platforms/android/app/build/outputs/apk/release
        zipalign -v 4 app-release-unsigned.apk ZeroMessenger.apk

    - uses: actions/upload-artifact@v4
      with:
        name: ZeroMessenger-APK
        path: ZeroMessenger/platforms/android/app/build/outputs/apk/release/ZeroMessenger.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ZeroMessenger/platforms/android/app/build/outputs/apk/release/ZeroMessenger.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
