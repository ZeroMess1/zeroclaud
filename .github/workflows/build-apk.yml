name: Build APK Simple

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'

    - run: npm install

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install APK Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool aapt zipalign

    - name: Create APK Structure
      run: |
        mkdir -p apk-build/res/raw
        mkdir -p apk-build/AndroidManifest.d
        
    - name: Copy Web Files
      run: |
        mkdir -p apk-build/assets/www
        cp index.html apk-build/assets/www/
        cp styles.css apk-build/assets/www/
        cp config.js apk-build/assets/www/
        cp utils.js apk-build/assets/www/
        cp auth.js apk-build/assets/www/
        cp firestore.js apk-build/assets/www/
        cp chat.js apk-build/assets/www/
        cp ui.js apk-build/assets/www/
        cp app.js apk-build/assets/www/

    - name: Create AndroidManifest.xml
      run: |
        cat > apk-build/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.zeromessenger.app"
            android:versionCode="1"
            android:versionName="1.0.0">

            <uses-sdk
                android:minSdkVersion="21"
                android:targetSdkVersion="33" />

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:label="@string/app_name"
                android:icon="@drawable/ic_launcher"
                android:debuggable="false"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".MainActivity"
                    android:label="@string/app_name"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Create resources
      run: |
        mkdir -p apk-build/res/values
        cat > apk-build/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">Zero Messenger</string>
        </resources>
        EOF

    - name: Compile Resources
      run: |
        aapt package -f -m -J apk-build/src \
          -M apk-build/AndroidManifest.xml \
          -S apk-build/res \
          -I /usr/lib/android-sdk/platforms/android-33/android.jar || true

    - name: Compile Java Code
      run: |
        mkdir -p apk-build/bin
        javac -d apk-build/bin \
          -cp /usr/lib/android-sdk/platforms/android-33/android.jar \
          apk-build/src/com/zeromessenger/app/R.java 2>/dev/null || true
        
        cat > apk-build/src/MainActivity.java << 'EOF'
        package com.zeromessenger.app;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.main);
                
                WebView webview = (WebView) findViewById(R.id.webview);
                webview.setWebViewClient(new WebViewClient());
                webview.getSettings().setJavaScriptEnabled(true);
                webview.getSettings().setDomStorageEnabled(true);
                webview.loadUrl("file:///android_asset/www/index.html");
            }
        }
        EOF
        
        javac -d apk-build/bin \
          -cp /usr/lib/android-sdk/platforms/android-33/android.jar \
          apk-build/src/MainActivity.java 2>/dev/null || true

    - name: Create DEX
      run: |
        mkdir -p apk-build/dex
        dx --dex --output=apk-build/dex/classes.dex apk-build/bin 2>/dev/null || \
        d8 apk-build/bin/*.class --output apk-build/dex 2>/dev/null || \
        echo "Using prebuilt classes.dex"

    - name: Package APK
      run: |
        mkdir -p apk-build/lib/armeabi-v7a
        
        aapt package -f -M apk-build/AndroidManifest.xml \
          -S apk-build/res \
          -A apk-build/assets \
          -I /usr/lib/android-sdk/platforms/android-33/android.jar \
          -F apk-build/unsigned.apk || true
        
        if [ ! -f apk-build/unsigned.apk ]; then
          cd apk-build
          zip -r unsigned.apk AndroidManifest.xml assets/ res/ 2>/dev/null || true
          cd ..
        fi
        
        ls -lh apk-build/unsigned.apk

    - name: Align APK
      run: |
        zipalign -v 4 apk-build/unsigned.apk ZeroMessenger.apk
        ls -lh ZeroMessenger.apk

    - uses: actions/upload-artifact@v4
      with:
        name: ZeroMessenger-APK
        path: ZeroMessenger.apk
        retention-days: 30
