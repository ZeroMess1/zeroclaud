- name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || true

    - name: SHOW FULL ERROR
      if: always()
      run: |
        echo "======= GREP ERRORS ======="
        grep -E "FAILED|Exception|error:|Error:" android/build.log | head -100 || true
        echo "======= LAST 150 LINES ======="
        tail -150 android/build.log
