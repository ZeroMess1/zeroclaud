name: Build Android APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Install Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.0
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/33.0.0" >> $GITHUB_PATH
        echo "Android SDK ready"
      
    - name: Initialize Capacitor
      run: npx cap add android || true
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Update app name in Capacitor
      run: |
        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.zeromessenger.app",
          "appName": "Zero Messenger",
          "webDir": ".",
          "plugins": {
            "SplashScreen": {
              "launchAutoHide": true
            }
          }
        }
        EOF
      
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: Find APK
      run: |
        find android -name "*.apk" -type f
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ZeroMessenger-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
