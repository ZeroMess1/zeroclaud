name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install npm dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK and Tools
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "Android SDK is ready"

    - name: Install Cordova
      run: npm install -g cordova@latest

    - name: Create Cordova Project
      run: |
        cordova create ZeroMessenger com.zeromessenger.app "Zero Messenger"
        cd ZeroMessenger
        cordova platform add android

    - name: Copy Web Files to Cordova
      run: |
        cd ZeroMessenger/www
        rm -f index.html
        cd ../../
        cp index.html ZeroMessenger/www/
        cp styles.css ZeroMessenger/www/
        cp config.js ZeroMessenger/www/
        cp utils.js ZeroMessenger/www/
        cp auth.js ZeroMessenger/www/
        cp firestore.js ZeroMessenger/www/
        cp chat.js ZeroMessenger/www/
        cp ui.js ZeroMessenger/www/
        cp app.js ZeroMessenger/www/

    - name: Update Cordova config.xml
      run: |
        cd ZeroMessenger
        cat > config.xml << 'XML_EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.zeromessenger.app" version="1.0.0" 
                xmlns="http://www.w3.org/ns/widgets" 
                xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Zero Messenger</name>
            <description>Modern Messenger App</description>
            <author email="support@zeromessenger.com" href="https://zeromessenger.com">Zero Messenger Team</author>
            <content src="index.html" />
            
            <allow-navigation href="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <allow-intent href="tel:*" />
            <allow-intent href="sms:*" />
            <allow-intent href="mailto:*" />
            <allow-intent href="geo:*" />
            
            <access origin="*" />
            
            <preference name="loglevel" value="verbose" />
            <preference name="android-minSdkVersion" value="21" />
            <preference name="android-targetSdkVersion" value="33" />
            <preference name="android-build-tool-version" value="33.0.0" />
            <preference name="orientation" value="portrait" />
            <preference name="fullscreen" value="false" />
            <preference name="DisallowOverscroll" value="true" />
        </widget>
        XML_EOF

    - name: Build APK (Release)
      run: |
        cd ZeroMessenger
        echo "Current directory: $(pwd)"
        echo "Checking Android structure:"
        ls -la platforms/android/
        cd platforms/android
        echo "Generating Gradle wrapper..."
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        echo "Building APK..."
        ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace
        echo "=== APK Files ==="
        find . -name "*.apk" -type f
      env:
        GRADLE_OPTS: -Xmx2048m

    - name: Decode Keystore
      run: |
        pwd
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        ls -lh release.keystore
        echo "Keystore path: $(pwd)/release.keystore"

    - name: Find and Sign APK
      run: |
        APK_FILE=$(find ZeroMessenger/platforms/android -name "app-release.apk" -o -name "app-release-unsigned.apk" | head -1)
        if [ -z "$APK_FILE" ]; then
          echo "APK не найден! Проверяем структуру:"
          find ZeroMessenger/platforms/android -name "*.apk" -type f
          find ZeroMessenger/platforms/android/app/build/outputs -type f 2>/dev/null || echo "Нет папки outputs"
          exit 1
        fi
        echo "Found APK: $APK_FILE"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore release.keystore \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          "$APK_FILE" \
          "${{ secrets.KEY_ALIAS }}"

    - name: Align APK
      run: |
        APK_FILE=$(find ZeroMessenger/platforms/android -name "app-release.apk" -o -name "app-release-unsigned.apk" | head -1)
        if [ -z "$APK_FILE" ]; then
          echo "APK не найден для выравнивания!"
          exit 1
        fi
        echo "Aligning: $APK_FILE"
        zipalign -v 4 "$APK_FILE" ZeroMessenger-final.apk
        ls -lh ZeroMessenger-final.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZeroMessenger-APK
        path: ZeroMessenger-final.apk
        retention-days: 30

    - name: Create Release (on Tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ZeroMessenger-final.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
